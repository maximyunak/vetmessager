basePath: /api/v1
definitions:
  github_com_maximyunak_vetmessager_internal_core_domain.Message:
    properties:
      chat_id:
        type: integer
      content:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: integer
      reply_to_message_id:
        type: integer
      sender_id:
        type: integer
      updated_at:
        type: string
    type: object
  github_com_maximyunak_vetmessager_internal_core_transport_http_response.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  github_com_maximyunak_vetmessager_internal_core_transport_http_types.Nullable-int:
    properties:
      set:
        type: boolean
      value:
        type: integer
    type: object
  github_com_maximyunak_vetmessager_internal_core_transport_http_types.Nullable-string:
    properties:
      set:
        type: boolean
      value:
        type: string
    type: object
  internal_features_messages_transport_http.CreateMessageRequest:
    properties:
      content:
        maxLength: 5000
        type: string
      reply_to_message_id:
        type: integer
    type: object
  internal_features_messages_transport_http.GetMessagesResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_features_messages_transport_http.MessageDTOResponse'
        type: array
      limit:
