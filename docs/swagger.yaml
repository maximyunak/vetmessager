    - first_name
    - last_name
    - password
    - username
    type: object
  internal_features_users_transport_http.CreateUserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  internal_features_users_transport_http.LoginRequest:
    properties:
      email:
        maxLength: 100
        minLength: 5
        type: string
      password:
        maxLength: 100
        minLength: 5
