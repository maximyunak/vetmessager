basePath: /api/v1
definitions:
  github_com_maximyunak_vetmessager_internal_core_transport_http_response.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  internal_features_users_transport_http.CreateUserRequest:
    properties:
      email:
        maxLength: 100
        minLength: 5
        type: string
      first_name:
        maxLength: 255
        minLength: 5
        type: string
      last_name:
        maxLength: 255
        minLength: 5
        type: string
      password:
        maxLength: 100
        minLength: 5
        type: string
      username:
        maxLength: 255
        minLength: 5
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    - username
    type: object
  internal_features_users_transport_http.CreateUserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  internal_features_users_transport_http.LoginRequest:
    properties:
      email:
        maxLength: 100
        minLength: 5
        type: string
      password:
        maxLength: 100
        minLength: 5
        type: string
    required:
    - email
    - password
    type: object
  internal_features_users_transport_http.LoginResponse:
    properties:
      access_token:
        type: string
    type: object
  internal_features_users_transport_http.UserDTOResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
host: localhost:5050
info:
  contact: {}
  description: Sveta the best
  title: VetMessager
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return an access token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_users_transport_http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/internal_features_users_transport_http.LoginResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_maximyunak_vetmessager_internal_core_transport_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_maximyunak_vetmessager_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_maximyunak_vetmessager_internal_core_transport_http_response.ErrorResponse'
      summary: Login user
      tags:
      - users
  /me:
    get:
      description: Get the authenticated user's information
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/internal_features_users_transport_http.UserDTOResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_maximyunak_vetmessager_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_maximyunak_vetmessager_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_maximyunak_vetmessager_internal_core_transport_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
  /register:
    post:
      consumes:
      - application/json
      description: Register new user in the system
      parameters:
      - description: CreateUser is request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_users_transport_http.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Success
          schema:
            $ref: '#/definitions/internal_features_users_transport_http.CreateUserResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_maximyunak_vetmessager_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_maximyunak_vetmessager_internal_core_transport_http_response.ErrorResponse'
      summary: Create user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: 'Enter your JWT token with the Bearer prefix. Example: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
